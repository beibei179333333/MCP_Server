# ================================================================
# SMM 自动增长方案配置文件 v3.0
# 场景：10 个 Telegram 频道，30 天渐进增长
# 策略：主力服务（粉丝/浏览/反应）+ 辅助服务（评论/分享/多地区粉丝/Premium 粉丝）
#
# ⚠️ API key 不写进仓库：下面用 ${ENV} 占位符，运行前先 export 对应环境变量
#    （见 smm_growth/README.md）。dry_run=true 时不需要 key 也能演练。
# ================================================================

start_date: "2026-06-02"
duration_days: 30
posts_per_day: 50

# ── 频道列表 ──
channels:
  - name: "🔥 东南亚头条·实时曝光"
    link: "https://t.me/Hpaydq"
  - name: "📢 全网大事件·真相曝光"
    link: "https://t.me/Wanbiaoge"
  - name: "🌏 西港金边·新闻现场"
    link: "https://t.me/iphone17pro"
  - name: "🚨 全网骗子·曝光台"
    link: "https://t.me/dashijianqun"
  - name: "📡 全球新闻·实时播报"
    link: "https://t.me/dashijianwang"
  - name: "🇰🇭 柬埔寨·西港华人圈"
    link: "https://t.me/dashijiangg"
  - name: "🌐 全球新闻·曝光第一线"
    link: "https://t.me/VietNAMVPNVN"
  - name: "💥 东南亚大事件·爆料中心"
    link: "https://t.me/dashijianz"
  - name: "全球热搜大事件"
    link: "https://t.me/FeiJishentou"
  - name: "东南亚大事件"
    link: "https://t.me/iphone17plus512G"

# ── SMM 面板 API（key 从环境变量读取）──
panels:
  smmfollows:
    url: "https://smmfollows.com/api/v2"
    key: "${SMMFOLLOWS_API_KEY}"
  smmstone:
    url: "https://smmstone.com/api/v2"
    key: "${SMMSTONE_API_KEY}"
  fenba:
    url: "https://fenba.vip/api/v2"
    key: "${FENBA_API_KEY}"

# ================================================================
# 增长曲线（数量随天数渐进；缺省回退到内置默认）
#   curve: linear | ease_in | ease_out | s_curve
#   jitter_pct: 每天数量上下浮动比例（确定性，可复现）
# ================================================================
growth:
  members:                 # 每天给每个频道新增的粉丝数
    start: 15
    end: 60
    curve: "ease_in"
    jitter_pct: 0.15
  views_per_post:          # AUTO 浏览：每帖目标浏览量
    start: 200
    end: 1500
    curve: "linear"
    jitter_pct: 0.10
  reactions_per_post:      # AUTO 反应：每帖目标反应数
    start: 20
    end: 150
    curve: "linear"
    jitter_pct: 0.10

# ================================================================
# 主力服务（粉丝每天 / 浏览·反应 AUTO 每 7 天续单）
# ================================================================
services:
