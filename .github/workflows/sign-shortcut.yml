name: Sign iOS Shortcut

# 目标：产出 iPhone 可直接导入的已签名 .shortcut 文件。
# 路线：Apple `shortcuts sign` 在 CI 上因 iCloud 登录要求不可用；
# 改走 Cherri 编译器内置的 HubSign 远程签名通道（--hubsign）。
# HubSign 裸 HTTP 端点有 Cloudflare 防护，必须通过 cherri 客户端调用。
on:
  push:
    branches:
      - claude/ai-router-engine-v4-d30ilc
    paths:
      - "scriptable/**"
      - ".github/workflows/sign-shortcut.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cherri-sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install Cherri
        run: |
          go install github.com/electrikmilk/cherri@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Show action reference (for fallback source corrections)
        continue-on-error: true
        run: |
          cherri --action=url --no-ansi 2>&1 | head -40 || true
          cherri --action=open --no-ansi 2>&1 | head -60 || true

      - name: Import existing shortcut into Cherri source
        continue-on-error: true
        run: |
          cp "scriptable/AI智能路由引擎.shortcut" input.shortcut
          cherri --import=input.shortcut --no-ansi 2>&1 || true
          echo "--- workspace after import ---"
          ls -la
          for f in *.cherri; do [ -f "$f" ] && { echo "=== $f ==="; cat "$f"; }; done

      - name: Write fallback Cherri source
        run: |
          cat > fallback.cherri <<'EOF'
          openURL("scriptable:///run/AI%E6%99%BA%E8%83%BD%E8%B7%AF%E7%94%B1%E5%BC%95%E6%93%8E")
          EOF
          cat fallback.cherri

      - name: Compile + sign via HubSign
        run: |
          try_compile() {
            local src="$1"
            echo "### compiling $src"
            rm -f AI-Router-signed.shortcut
            cherri "$src" -s=anyone --hubsign --no-ansi -o=AI-Router-signed.shortcut 2>&1 || return 1
            [ -f AI-Router-signed.shortcut ] || return 1
            echo "--- magic bytes ---"
            head -c 16 AI-Router-signed.shortcut | xxd
            head -c 4 AI-Router-signed.shortcut | grep -q "AEA1"
          }
          OK=""
          for src in $(ls *.cherri | grep -v '^fallback.cherri$') fallback.cherri; do
            [ -f "$src" ] || continue
            if try_compile "$src"; then OK="$src"; break; fi
            echo "!!! $src failed, trying next"
          done
          if [ -z "$OK" ]; then echo "all sources failed to produce a signed shortcut"; exit 1; fi
          echo "signed successfully from: $OK"
          ls -la AI-Router-signed.shortcut
          echo "SIGNED_OK=1" >> "$GITHUB_ENV"

      - name: Upload artifact
        if: env.SIGNED_OK == '1'
        uses: actions/upload-artifact@v4
        with:
          name: AI-Router-signed
          path: AI-Router-signed.shortcut

      - name: Commit signed file back to branch
        if: env.SIGNED_OK == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p signed
          cp AI-Router-signed.shortcut "signed/AI智能路由引擎-已签名.shortcut"
          git add signed/
          git commit -m "Add HubSign-signed shortcut (CI)"
          git pull --rebase origin claude/ai-router-engine-v4-d30ilc || true
          git push origin HEAD:claude/ai-router-engine-v4-d30ilc

      - name: Publish to release
        if: env.SIGNED_OK == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create shortcut-signed \
            --title "AI 智能路由引擎 · 已签名快捷指令" \
            --notes "iPhone 直接下载本文件并打开，即可导入快捷指令 App。内部动作：通过 URL Scheme 运行 Scriptable 脚本「AI智能路由引擎」。" \
            --target "${GITHUB_SHA}" 2>/dev/null || true
          gh release upload shortcut-signed AI-Router-signed.shortcut --clobber
