name: Sign iOS Shortcut

# 目标：产出 iPhone 可直接导入的已签名 .shortcut 文件。
# 路线：Apple `shortcuts sign` 在 CI 上因 iCloud 登录要求不可用；
# 改走 Cherri 编译器内置的 HubSign 远程签名通道（--hubsign）。
# HubSign 裸 HTTP 端点有 Cloudflare 防护，必须通过 cherri 客户端调用。
on:
  push:
    branches:
      - claude/ai-router-engine-v4-d30ilc
    paths:
      - "scriptable/**"
      - ".github/workflows/sign-shortcut.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cherri-sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install Cherri
        run: |
          go install github.com/electrikmilk/cherri@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Show HubSign flag handling in Cherri source
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/electrikmilk/cherri /tmp/cherri-src
          echo "=== hubsign / signing call sites (non-test) ==="
          grep -rn -iE "hubsign|signing" /tmp/cherri-src --include="*.go" | grep -v _test | head -30 || true
          F=$(grep -rl -i "hubsign" /tmp/cherri-src --include="*.go" | grep -v _test | head -1)
          if [ -n "$F" ]; then
            echo "=== $F (hubsign region) ==="
            grep -n -i -B5 -A40 "hubsign" "$F" | head -120
          fi

      - name: Write main Cherri source
        run: |
          cat > main.cherri <<'EOF'
          #include 'actions/web'
          #define color violet
          #define glyph magicWand

          openURL("scriptable:///run/AI%E6%99%BA%E8%83%BD%E8%B7%AF%E7%94%B1%E5%BC%95%E6%93%8E")
          EOF
          cat main.cherri

      - name: Compile + sign via HubSign
        run: |
          # 在所有产物里找 AEA1 魔数（已签名的 Apple Encrypted Archive）
          find_signed() {
            for f in *.shortcut; do
              [ -f "$f" ] || continue
              if head -c 4 "$f" | grep -q "AEA1"; then echo "$f"; return 0; fi
            done
            return 1
          }
          attempt() {
            echo "### attempt: cherri $*"
            rm -f main.shortcut main_unsigned.shortcut out.shortcut
            timeout 120 cherri "$@" 2>&1
            echo "(exit=$?)"
            ls -la *.shortcut 2>/dev/null || true
          }
          # 参数解析行为不明：多种写法逐一尝试（长/短标志、标志在文件前/后）
          attempt main.cherri --share=anyone --hubsign --no-ansi
          SIGNED=$(find_signed) || true
          if [ -z "$SIGNED" ]; then
            attempt --share=anyone --hubsign --no-ansi main.cherri
            SIGNED=$(find_signed) || true
          fi
          if [ -z "$SIGNED" ]; then
            attempt main.cherri -s=anyone --hubsign
            SIGNED=$(find_signed) || true
          fi
          if [ -z "$SIGNED" ]; then
            attempt main.cherri --share=anyone --output=out.shortcut --hubsign --no-ansi
            SIGNED=$(find_signed) || true
          fi
          if [ -z "$SIGNED" ]; then
            echo "no AEA1-signed output produced by any invocation"
            exit 1
          fi
          echo "signed file: $SIGNED"
          cp "$SIGNED" AI-Router-signed.shortcut
          head -c 16 AI-Router-signed.shortcut | xxd
          ls -la AI-Router-signed.shortcut
          echo "SIGNED_OK=1" >> "$GITHUB_ENV"

      - name: Upload artifact
        if: env.SIGNED_OK == '1'
        uses: actions/upload-artifact@v4
        with:
          name: AI-Router-signed
          path: AI-Router-signed.shortcut

      - name: Commit signed file back to branch
        if: env.SIGNED_OK == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p signed
          cp AI-Router-signed.shortcut "signed/AI智能路由引擎-已签名.shortcut"
          git add signed/
          git commit -m "Add HubSign-signed shortcut (CI)"
          git pull --rebase origin claude/ai-router-engine-v4-d30ilc || true
          git push origin HEAD:claude/ai-router-engine-v4-d30ilc

      - name: Publish to release
        if: env.SIGNED_OK == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create shortcut-signed \
            --title "AI 智能路由引擎 · 已签名快捷指令" \
            --notes "iPhone 直接下载本文件并打开，即可导入快捷指令 App。内部动作：通过 URL Scheme 运行 Scriptable 脚本「AI智能路由引擎」。" \
            --target "${GITHUB_SHA}" 2>/dev/null || true
          gh release upload shortcut-signed AI-Router-signed.shortcut --clobber
